[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-agent"
version = "0.1.0"
description = "Local-first LLM Wiki Agent: BM25 retrieval over local Markdown wiki with OpenAI-compatible generation, HTTP/SSE API, web page and DingTalk Stream bot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dingtalk = ["dingtalk-stream>=0.4"]
# 文档解析（PDF / DOCX / XLSX）。缺失时这些格式会被跳过，Markdown 不受影响。
docs = ["pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# 系统 Prompt 中文说明行无法安全折行
"app/service/prompts.py" = ["E501"]
