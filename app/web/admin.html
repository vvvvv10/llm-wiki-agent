<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wiki 管理 - 宠物药品客服</title>
<style>
  :root {
    --primary: #1677ff;
    --primary-hover: #4096ff;
    --primary-active: #0958d9;
    --primary-bg: #e6f4ff;
    --text: rgba(0, 0, 0, 0.88);
    --text-2: rgba(0, 0, 0, 0.65);
    --text-3: rgba(0, 0, 0, 0.45);
    --border: #d9d9d9;
    --border-light: #f0f0f0;
    --bg-layout: #f7f8fa;
    --bg-container: #ffffff;
    --danger: #ff4d4f;
    --danger-bg: #fff2f0;
    --danger-border: #ffccc7;
    --danger-text: #cf1322;
    --ok: #52c41a;
    --ok-bg: #f6ffed;
    --ok-border: #b7eb8f;
    --ok-text: #389e0d;
    --shadow-1: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02);
    --shadow-2: 0 6px 16px -8px rgba(0, 0, 0, 0.08), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-layout);
    color: var(--text);
    font-size: 14px;
  }
  /* ---------- 顶栏 ---------- */
  .navbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 56px;
    background: var(--bg-container);
    border-bottom: 1px solid var(--border-light);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px; flex: none; border-radius: 8px;
    background: linear-gradient(135deg, #1677ff, #722ed1);
    color: #fff; font-weight: 700; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-1);
  }
  .brand-title { font-size: 15px; font-weight: 600; }
  .brand-tag { font-size: 12px; color: var(--primary); background: var(--primary-bg); border-radius: 4px; padding: 1px 6px; }
  .nav-link {
    font-size: 13px; color: var(--text-2); text-decoration: none;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; background: var(--bg-container); transition: all 0.2s;
  }
  .nav-link:hover { color: var(--primary); border-color: var(--primary-hover); }
  /* ---------- 布局 ---------- */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  .page-head h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .page-head p { color: var(--text-2); margin: 0 0 20px; font-size: 13.5px; }
  .card {
    background: var(--bg-container);
    border: 1px solid var(--border-light);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-1);
  }
  /* ---------- 控件 ---------- */
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    height: 32px; padding: 0 15px; font-size: 13.5px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-container); color: var(--text);
    cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { color: var(--primary); border-color: var(--primary-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-2); }
  input[type="text"] {
    width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 6px;
    padding: 0 11px; font-size: 14px; font-family: inherit; background: var(--bg-container);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
  textarea {
    width: 100%; min-height: 400px; resize: vertical;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.6;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
  /* ---------- 状态与提示 ---------- */
  .status { font-size: 13px; color: var(--text-2); }
  .status b { color: var(--text); font-weight: 600; }
  .msg { display: none; font-size: 13px; margin-top: 12px; padding: 8px 12px; border-radius: 6px; line-height: 1.6; }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
  .msg.err { display: block; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
  /* ---------- 表格 ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
  th { color: var(--text-2); font-weight: 500; background: var(--bg-layout); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #fafafa; }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-2); }
  .summary { color: var(--text-3); font-size: 12px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--text-3); font-size: 13px; padding: 32px; text-align: center; }
  /* ---------- 编辑器 ---------- */
  .editor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .editor-title { font-size: 15px; font-weight: 600; }
  .badge { font-size: 11.5px; padding: 2px 10px; border-radius: 999px; background: var(--primary-bg); color: var(--primary); }
  .hidden { display: none; }
</style>
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <div class="logo">W</div>
      <span class="brand-title">Wiki 管理</span>
      <span class="brand-tag">LLM Wiki Agent</span>
    </div>
    <a class="nav-link" href="/">← 返回问答</a>
  </header>

  <div class="container">
    <div class="page-head">
      <h1>Wiki 在线管理</h1>
      <p>管理宠物药品知识库文档（含汉维宠仕产品资料），修改后重建索引使问答立即生效。</p>
    </div>

    <div class="card">
      <div class="row">
        <button class="btn primary" id="loadBtn">加载文档列表</button>
        <button class="btn" id="newBtn">+ 新建文档</button>
        <button class="btn" id="reindexBtn">重建索引</button>
        <span class="status" id="health"></span>
      </div>
      <div class="msg" id="globalMsg"></div>
    </div>

    <div class="card" id="listCard">
      <table>
        <thead><tr><th>路径</th><th>标题</th><th>摘要</th><th>分段数</th><th></th></tr></thead>
        <tbody id="docList"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>

    <div class="card hidden" id="editorCard">
      <div class="editor-head">
        <span class="editor-title" id="editorTitle">编辑文档</span>
        <span class="badge" id="editorBadge"></span>
      </div>
      <label for="docPath">文档路径（相对于 wiki/，必须以 .md 结尾）</label>
      <input id="docPath" type="text" placeholder="例如：expense-policy.md 或 subdir/doc.md" />
      <label for="docContent" style="margin-top:12px">内容（Markdown）</label>
      <textarea id="docContent" placeholder="# 标题&#10;&#10;## 小节&#10;&#10;正文内容…"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="saveBtn">保存</button>
        <button class="btn" id="cancelBtn">取消</button>
        <span class="status" style="font-size:12px;color:var(--text-3)">保存后需点「重建索引」才会进入检索。</span>
      </div>
      <div class="msg" id="editorMsg"></div>
    </div>
  </div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var JSON_HEADERS = { "Content-Type": "application/json" };

  function apiError(res, body) {
    if (body && body.detail && body.detail.message) return body.detail.message;
    return "请求失败（HTTP " + res.status + "）";
  }

  function showMsg(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
  function hideMsg(el) { el.className = "msg"; }

  function loadHealth() {
    fetch("/health").then(function (r) { return r.json(); }).then(function (d) {
      $("health").textContent = "";
      var items = [["文档", d.documents], ["分段", d.chunks], ["索引", d.index_ready ? "就绪" : "不可用"]];
      items.forEach(function (p) {
        var s = document.createElement("span");
        s.style.marginRight = "14px";
        var b = document.createElement("b"); b.textContent = p[0] + "：";
        s.appendChild(b); s.appendChild(document.createTextNode(String(p[1])));
        $("health").appendChild(s);
      });
    }).catch(function () { $("health").textContent = "无法连接服务。"; });
  }

  function loadList() {
    hideMsg($("globalMsg"));
    fetch("/v1/wiki/documents", { headers: JSON_HEADERS }).then(function (r) {
      return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; });
    }).then(function (r) {
      if (!r.ok) { showMsg($("globalMsg"), apiError({ status: r.status }, r.body), false); return; }
      renderList(r.body.items || []);
    }).catch(function () { showMsg($("globalMsg"), "加载失败。", false); });
  }

  function renderList(items) {
    var tbody = $("docList");
    tbody.textContent = "";
    if (!items.length) {
      var tr0 = document.createElement("tr");
      var td0 = document.createElement("td"); td0.colSpan = 5; td0.className = "empty";
      td0.textContent = "暂无文档，点击「新建文档」创建。";
      tr0.appendChild(td0); tbody.appendChild(tr0); return;
    }
    items.forEach(function (item) {
      var tr = document.createElement("tr"); tr.className = "clickable";
      var tdPath = document.createElement("td"); tdPath.className = "path"; tdPath.textContent = item.path;
      var tdTitle = document.createElement("td"); tdTitle.textContent = item.title || "";
      var tdSummary = document.createElement("td"); tdSummary.className = "summary"; tdSummary.textContent = item.summary || "";
      var tdChunks = document.createElement("td"); tdChunks.textContent = String(item.chunks);
      var tdOps = document.createElement("td");
      var editBtn = document.createElement("button"); editBtn.className = "btn"; editBtn.textContent = "编辑";
      editBtn.addEventListener("click", function (e) { e.stopPropagation(); openEditor(item.path); });
      var delBtn = document.createElement("button"); delBtn.className = "btn danger"; delBtn.textContent = "删除"; delBtn.style.marginLeft = "6px";
      delBtn.addEventListener("click", function (e) { e.stopPropagation(); deleteDoc(item.path); });
      tdOps.appendChild(editBtn); tdOps.appendChild(delBtn);
      [tdPath, tdTitle, tdSummary, tdChunks, tdOps].forEach(function (td) { tr.appendChild(td); });
      tr.addEventListener("click", function () { openEditor(item.path); });
      tbody.appendChild(tr);
    });
  }

  function openEditor(path) {
    hideMsg($("editorMsg"));
    $("editorCard").classList.remove("hidden");
    $("docPath").value = path || "";
    $("docPath").disabled = !!path;
    $("editorBadge").textContent = path ? "编辑" : "新建";
    if (!path) { $("docContent").value = ""; $("docContent").focus(); return; }
    fetch("/v1/wiki/documents/" + encodeURIComponent(path).replace(/%2F/g, "/"), { headers: JSON_HEADERS })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; }); })
      .then(function (r) {
        if (!r.ok) { showMsg($("editorMsg"), apiError({ status: r.status }, r.body), false); return; }
        $("docContent").value = r.body.content || "";
      }).catch(function () { showMsg($("editorMsg"), "加载文档内容失败。", false); });
    $("editorCard").scrollIntoView({ behavior: "smooth" });
  }

  $("newBtn").addEventListener("click", function () { openEditor(null); });
  $("cancelBtn").addEventListener("click", function () { $("editorCard").classList.add("hidden"); });
  $("loadBtn").addEventListener("click", loadList);

  $("saveBtn").addEventListener("click", function () {
    var path = $("docPath").value.trim();
    var content = $("docContent").value;
    if (!path) { showMsg($("editorMsg"), "请填写文档路径。", false); return; }
    var url = "/v1/wiki/documents/" + path.split("/").map(encodeURIComponent).join("/");
    fetch(url, { method: "PUT", headers: JSON_HEADERS, body: JSON.stringify({ content: content }) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; }); })
      .then(function (r) {
        if (!r.ok) { showMsg($("editorMsg"), apiError({ status: r.status }, r.body), false); return; }
        showMsg($("editorMsg"), "已保存。点「重建索引」后新内容才会被检索到。", true);
        loadList();
      }).catch(function () { showMsg($("editorMsg"), "保存失败。", false); });
  });

  function deleteDoc(path) {
    if (!confirm("确定删除 " + path + " ？删除后需重建索引。")) return;
    var url = "/v1/wiki/documents/" + path.split("/").map(encodeURIComponent).join("/");
    fetch(url, { method: "DELETE", headers: JSON_HEADERS })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; }); })
      .then(function (r) {
        if (!r.ok) { showMsg($("globalMsg"), apiError({ status: r.status }, r.body), false); return; }
        showMsg($("globalMsg"), "已删除 " + path + "。点「重建索引」生效。", true);
        loadList();
      }).catch(function () { showMsg($("globalMsg"), "删除失败。", false); });
  }

  $("reindexBtn").addEventListener("click", function () {
    hideMsg($("globalMsg"));
    fetch("/v1/wiki/reindex", { method: "POST", headers: JSON_HEADERS })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; }); })
      .then(function (r) {
        if (!r.ok) { showMsg($("globalMsg"), apiError({ status: r.status }, r.body), false); return; }
        var taskId = r.body.task_id;
        pollTask(taskId);
      }).catch(function () { showMsg($("globalMsg"), "触发重建失败。", false); });
  });

  function pollTask(taskId) {
    fetch("/v1/wiki/reindex/" + taskId, { headers: JSON_HEADERS })
      .then(function (r) { return r.json(); })
      .then(function (b) {
        if (b.status === "RUNNING") { setTimeout(function () { pollTask(taskId); }, 800); return; }
        if (b.status === "SUCCEEDED") {
          showMsg($("globalMsg"), "索引重建完成，问答已生效。", true);
          loadHealth(); loadList();
        } else {
          showMsg($("globalMsg"), "索引重建失败：" + (b.error_code || "未知错误"), false);
        }
      }).catch(function () { showMsg($("globalMsg"), "查询重建状态失败。", false); });
  }

  loadHealth();
  loadList();
})();
</script>
</body>
</html>
